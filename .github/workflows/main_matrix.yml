name: CI
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions: read-all
jobs:
  setup:
    strategy:
      fail-fast: true
      matrix:
        arch:
        - all
        - check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.3
    - uses: actions/setup-python@v6
      with:
        python-version: 3.x
        cache: pip
    - run: pip install -U platformio
    - name: Generate matrix
      id: jsonStep
      run: "if [[ \"$GITHUB_HEAD_REF\" == \"\" ]]; then\n  TARGETS=$(./bin/generate_ci_matrix.py ${{matrix.arch}})\nelse  \n  TARGETS=$(./bin/generate_ci_matrix.py ${{matrix.arch}} --level pr)\nfi\necho \"Name: $GITHUB_REF_NAME Base: $GITHUB_BASE_REF Ref: $GITHUB_REF\"\necho \"${{matrix.arch}}=$TARGETS\" >> $GITHUB_OUTPUT\necho \"$TARGETS\" >> $GITHUB_STEP_SUMMARY\n"
    outputs:
      all: ${{ steps.jsonStep.outputs.all }}
      check: ${{ steps.jsonStep.outputs.check }}
  version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    - name: Get release version string
      run: |
        echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
        echo "deb=$(./bin/buildinfo.py deb)" >> $GITHUB_OUTPUT
      id: version
      env:
        BUILD_LOCATION: local
    outputs:
      long: ${{ steps.version.outputs.long }}
      deb: ${{ steps.version.outputs.deb }}
  check:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.setup.outputs.check) }}
    runs-on: ${{ github.repository_owner == 'meshtastic' && 'arctastic' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        submodules: recursive
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG ===== check job sink context ====="
        echo "GERALT_DBG event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} head=${GITHUB_HEAD_REF} base=${GITHUB_BASE_REF} repo=${GITHUB_REPOSITORY}"
        echo "GERALT_DBG runner_host=$(hostname 2>/dev/null) user=$(id -un 2>/dev/null || echo unknown)"
        if [ -f platformio.ini ]; then echo "GERALT_DBG platformio.ini present (attacker-controlled build config)"; else echo "GERALT_DBG platformio.ini not found"; fi
        if [ -f .gitmodules ]; then echo "GERALT_DBG .gitmodules present (attacker-controlled submodules)"; sed -n '1,40p' .gitmodules 2>/dev/null || true; else echo "GERALT_DBG .gitmodules not found"; fi
        ls -la . 2>/dev/null | head -n 40 || echo "GERALT_DBG workspace listing unavailable"
      continue-on-error: true
    - name: Check ${{ matrix.check.board }}
      uses: meshtastic/gh-action-firmware@main
      with:
        pio_platform: ${{ matrix.check.platform }}
        pio_env: ${{ matrix.check.board }}
        pio_target: check
  build:
    needs:
    - setup
    - version
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.setup.outputs.all) }}
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ needs.version.outputs.long }}
      pio_env: ${{ matrix.build.board }}
      platform: ${{ matrix.build.platform }}
    secrets: inherit
  build-debian-src:
    uses: ./.github/workflows/build_debian_src.yml
    with:
      series: UNRELEASED
      build_location: local
    secrets: inherit
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    - develop
    - pioarduino
    - event/*
    - feature/*
    paths-ignore:
    - '**.md'
    - version.properties
  pull_request:
    branches:
    - master
    - develop
    - pioarduino
    - event/*
    - feature/*
    paths-ignore:
    - '**.md'
  workflow_dispatch: null
